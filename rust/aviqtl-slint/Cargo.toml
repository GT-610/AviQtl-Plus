[package]
name = "aviqtl-slint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
aviqtl-app = { path = "../aviqtl-app" }
aviqtl-export = { path = "../aviqtl-export" }
aviqtl-preview = { path = "../aviqtl-preview" }
fontdb = "0.23.0"
pollster = "0.4"
rfd = "0.15.4"
serde_json = "1.0"
slint = { version = "1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-femtovg-wgpu", "unstable-wgpu-29", "unstable-winit-030"] }
sys-locale = "0.3.2"
webbrowser = "1.2.4"

[build-dependencies]
roxmltree = "0.21.1"
slint-build = "1.17.1"
