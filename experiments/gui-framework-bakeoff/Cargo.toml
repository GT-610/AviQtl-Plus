[workspace]
resolver = "3"
members = [
    "crates/egui-adapter",
    "crates/gpui-adapter",
    "crates/lab-core",
    "crates/lab-driver",
    "crates/slint-adapter",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
aviqtl-gui-lab-core = { path = "crates/lab-core" }
eframe = { version = "0.36.0", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
gpui = { package = "gpui-ce", version = "0.2.2", default-features = false, features = ["font-kit"] }
gpui-ce-platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["font-kit"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
slint = { version = "1.17.1", default-features = false, features = ["accessibility", "backend-winit", "compat-1-2", "renderer-femtovg-wgpu", "unstable-wgpu-29"] }
unicode-segmentation = "1.12.0"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
debug = 1
