[workspace]
resolver = "3"
members = [
    "crates/lab-core",
    "crates/lab-driver",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
publish = false

[workspace.dependencies]
aviqtl-gui-lab-core = { path = "crates/lab-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "thin"
codegen-units = 1
debug = 1

