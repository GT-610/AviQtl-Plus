name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test Rust + Slint
    uses: ./.github/workflows/rust-checks.yml

  qt:
    name: Test Qt compatibility
    uses: ./.github/workflows/qt-checks.yml

  build:
    name: Build ${{ matrix.platform }}
    needs: [test, qt]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-latest
            container: archlinux:latest
            artifact_name: AviQtl-Arch-Linux-x86_64
            artifact_path: dist/AviQtl-Arch-Linux-x86_64.zip
          - platform: macos
            runs_on: macos-14
            artifact_name: AviQtl-macOS
            artifact_path: dist/AviQtl-macOS-Xcode-*.zip
          - platform: windows
            runs_on: windows-latest
            artifact_name: AviQtl-MSVC-Windows-x86_64
            artifact_path: dist/AviQtl-MSVC-x86_64.zip
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --needed --noconfirm \
            alsa-lib base-devel clang python pkgconf zip ffmpeg mesa vulkan-devel \
            libx11 libxcursor libxi libxrandr libxkbcommon wayland wayland-protocols

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install pkgconf ffmpeg

      - uses: actions/setup-python@v5
        if: matrix.platform == 'windows'
        with:
          python-version: "3.13"

      - name: Locate vcpkg and fingerprint the ABI tools
        if: matrix.platform == 'windows'
        id: vcpkg-tools
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg.exe was not found under $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # vcpkg hashes ABI-sensitive host tools (PowerShell and CMake) and the
          # vcpkg checkout itself into every package ABI, so a runner image update
          # silently invalidates the whole binary cache. Fingerprint those inputs
          # and feed the result into the cache key: a tool change then produces a
          # new key that is actually stored, instead of hitting a stale entry that
          # actions/cache refuses to overwrite.
          $tools = @(
            (& $vcpkg version | Select-Object -First 1)
            $PSVersionTable.PSVersion.ToString()
            (& cmake --version | Select-Object -First 1)
          )
          # BUILD.py prefers the vcpkg bundled with Visual Studio once vcvarsall
          # exports VCPKG_ROOT, so fingerprint that copy as well.
          $vswherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path -LiteralPath $vswherePath) {
            foreach ($installPath in (& $vswherePath -latest -products * -property installationPath)) {
              $bundled = Join-Path $installPath "VC\vcpkg\vcpkg.exe"
              if (Test-Path -LiteralPath $bundled) {
                $tools += (& $bundled version | Select-Object -First 1)
              }
              # The MSVC toolset hash is part of vcpkg's triplet_abi, so an update
              # that only moves Visual Studio must rotate the key as well.
              $msvcRoots = Join-Path $installPath "VC\Tools\MSVC"
              if (Test-Path -LiteralPath $msvcRoots) {
                $tools += (Get-ChildItem -LiteralPath $msvcRoots -Directory |
                  Sort-Object Name | ForEach-Object { $_.Name })
              }
            }
          }
          $fingerprint = $tools -join "`n"
          Write-Output "ABI tool fingerprint inputs:"
          Write-Output $fingerprint
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hash = ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($fingerprint)) |
            ForEach-Object { $_.ToString("x2") }) -join ""
          if (-not $hash) { throw "Failed to compute the ABI tool fingerprint" }
          "fingerprint=$hash" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg downloads
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: .build_tmp/vcpkg-downloads
          key: windows-msvc-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            windows-msvc-vcpkg-downloads-

      - name: Restore vcpkg binary cache
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            .build_tmp/vcpkg-binary-cache
            .build_tmp/msvc/Release/vcpkg_installed
          key: windows-msvc-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ steps.vcpkg-tools.outputs.fingerprint }}
          restore-keys: |
            windows-msvc-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-

      - name: Restore Rust build cache
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          # BUILD.py redirects CARGO_TARGET_DIR into .build_tmp, so the release
          # build does not live in rust/target. The registry is cached too: cargo
          # skips a dependency only while its extracted sources are older than the
          # restored fingerprints.
          path: |
            .build_tmp/msvc/Release/cargo-target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-msvc-rust-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-msvc-rust-

      - name: Prepare vcpkg cache
        if: matrix.platform == 'windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .build_tmp\vcpkg-binary-cache | Out-Null

      - name: Determine version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' rust/Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine version from rust/Cargo.toml" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $REF_NAME does not match v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: python BUILD.py --arch --no-container --version "${{ steps.version.outputs.version }}"

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: python BUILD.py --xcode --version "${{ steps.version.outputs.version }}"

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.build_tmp\vcpkg-binary-cache,readwrite
          # Without this, vcpkg downloads into %LOCALAPPDATA%\vcpkg\downloads and
          # the cached .build_tmp/vcpkg-downloads directory stays empty.
          VCPKG_DOWNLOADS: ${{ github.workspace }}\.build_tmp\vcpkg-downloads
        run: python BUILD.py --msvc --version "${{ steps.version.outputs.version }}"

      - name: Verify package has no Qt runtime
        shell: bash
        run: |
          if find build -iname 'Qt6*' -print -quit | grep -q .; then
            echo "Qt runtime files were packaged" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: AviQtl-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
