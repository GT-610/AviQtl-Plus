name: Build & Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  test:
    name: Test Rust + Slint
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy
      - name: Install native dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --needed --noconfirm \
            base-devel clang python pkgconf ffmpeg mesa vulkan-devel \
            libx11 libxcursor libxi libxrandr libxkbcommon wayland wayland-protocols
      - name: Validate
        run: |
          python -m unittest tests.test_build_version
          cargo fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo clippy --manifest-path rust/Cargo.toml --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --manifest-path rust/Cargo.toml --locked --workspace --all-features

  build:
    name: Build ${{ matrix.platform }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runs_on: ubuntu-latest
            container: archlinux:latest
            artifact_name: AviQtl-Arch-Linux-x86_64
            artifact_path: dist/AviQtl-Arch-Linux-x86_64.zip
          - platform: macos
            runs_on: macos-14
            artifact_name: AviQtl-macOS
            artifact_path: dist/AviQtl-macOS-Xcode-*.zip
          - platform: windows
            runs_on: windows-latest
            artifact_name: AviQtl-MSVC-Windows-x86_64
            artifact_path: dist/AviQtl-MSVC-x86_64.zip
    runs-on: ${{ matrix.runs_on }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm archlinux-keyring
          pacman -S --needed --noconfirm \
            base-devel clang python pkgconf zip ffmpeg mesa vulkan-devel \
            libx11 libxcursor libxi libxrandr libxkbcommon wayland wayland-protocols

      - name: Install macOS dependencies
        if: matrix.platform == 'macos'
        run: brew install pkgconf ffmpeg

      - uses: actions/setup-python@v5
        if: matrix.platform == 'windows'
        with:
          python-version: "3.13"

      - name: Locate vcpkg
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          if (-not (Test-Path -LiteralPath (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            throw "vcpkg.exe was not found under $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg caches
        if: matrix.platform == 'windows'
        uses: actions/cache@v4
        with:
          path: |
            .build_tmp/vcpkg-binary-cache
            .build_tmp/msvc/Release/vcpkg_installed
          key: windows-msvc-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Prepare vcpkg cache
        if: matrix.platform == 'windows'
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .build_tmp\vcpkg-binary-cache | Out-Null

      - name: Determine version
        id: version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/p' rust/Cargo.toml | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not determine version from rust/Cargo.toml" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "v$VERSION" ]; then
            echo "Release tag $REF_NAME does not match v$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: python BUILD.py --arch --no-container --version "${{ steps.version.outputs.version }}"

      - name: Build macOS
        if: matrix.platform == 'macos'
        run: python BUILD.py --xcode --version "${{ steps.version.outputs.version }}"

      - name: Build Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.build_tmp\vcpkg-binary-cache,readwrite
        run: python BUILD.py --msvc --version "${{ steps.version.outputs.version }}"

      - name: Verify package has no Qt runtime
        shell: bash
        run: |
          if find build -iname 'Qt6*' -print -quit | grep -q .; then
            echo "Qt runtime files were packaged" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: AviQtl-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
