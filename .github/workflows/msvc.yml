name: MSVC Baseline

on:
  workflow_dispatch:
  push:
    branches: ["main", "ci/msvc-*"]
    paths:
      - ".github/workflows/msvc.yml"
      - "BUILD.py"
      - "tests/test_build_version.py"
      - "rust/**"
      - "rust-toolchain.toml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/msvc.yml"
      - "BUILD.py"
      - "tests/test_build_version.py"
      - "rust/**"
      - "rust-toolchain.toml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"

permissions:
  contents: read

concurrency:
  group: msvc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test MSVC Release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GIT_TERMINAL_PROMPT: "0"
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.build_tmp\vcpkg-binary-cache,readwrite

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          if (-not (Test-Path -LiteralPath (Join-Path $vcpkgRoot "vcpkg.exe"))) {
            throw "vcpkg.exe was not found under $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore vcpkg caches
        uses: actions/cache@v4
        with:
          path: |
            .build_tmp/vcpkg-downloads
            .build_tmp/vcpkg-binary-cache
            .build_tmp/msvc/Release/vcpkg_installed
          key: windows-msvc-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}

      - name: Prepare cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .build_tmp\vcpkg-binary-cache | Out-Null

      - name: Validate build script
        run: python -m unittest tests.test_build_version

      - name: Build and package Slint application
        shell: pwsh
        run: python BUILD.py --msvc

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --manifest-path rust/Cargo.toml --locked --workspace

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "build\AviQtl.exe")) {
            throw "Packaged AviQtl.exe is missing"
          }
          if ((Get-ChildItem -LiteralPath build -Filter "Qt6*.dll" -File).Count -ne 0) {
            throw "Qt runtime DLLs must not be present in the Slint package"
          }
          if ((Get-ChildItem -LiteralPath build -Filter "avcodec*.dll" -File).Count -eq 0) {
            throw "FFmpeg runtime DLLs are missing"
          }
          foreach ($directory in @("effects", "objects", "plugins", "effect-packages", "repos")) {
            if (-not (Test-Path -LiteralPath (Join-Path "build" $directory))) {
              throw "Packaged resource directory is missing: $directory"
            }
          }
          if (-not (Test-Path -LiteralPath "dist\AviQtl-MSVC-x86_64.zip")) {
            throw "MSVC package archive was not created"
          }
