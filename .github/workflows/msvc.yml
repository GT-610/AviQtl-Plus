name: MSVC Baseline

on:
  workflow_dispatch:
  push:
    branches: ["main", "ci/msvc-*"]
    paths:
      - ".github/workflows/msvc.yml"
      - "BUILD.py"
      - "tests/test_build_version.py"
      - "rust/**"
      - "rust-toolchain.toml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "ports/**"
  pull_request:
    branches: ["main"]
    paths:
      - ".github/workflows/msvc.yml"
      - "BUILD.py"
      - "tests/test_build_version.py"
      - "rust/**"
      - "rust-toolchain.toml"
      - "vcpkg.json"
      - "vcpkg-configuration.json"
      - "ports/**"

permissions:
  contents: read

concurrency:
  group: msvc-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test MSVC Release
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      GIT_TERMINAL_PROMPT: "0"
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\.build_tmp\vcpkg-binary-cache,readwrite
      # Without this, vcpkg downloads into %LOCALAPPDATA%\vcpkg\downloads and the
      # cached .build_tmp/vcpkg-downloads directory stays empty on every run.
      VCPKG_DOWNLOADS: ${{ github.workspace }}\.build_tmp\vcpkg-downloads

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy, rustfmt

      - name: Locate vcpkg and fingerprint the ABI tools
        id: vcpkg-tools
        shell: pwsh
        run: |
          # A half-computed fingerprint would key a cache to a toolchain that is
          # not the one this run uses, so a failed probe has to fail the step.
          $ErrorActionPreference = "Stop"
          $vcpkgRoot = $env:VCPKG_INSTALLATION_ROOT
          if (-not $vcpkgRoot) { $vcpkgRoot = "C:\vcpkg" }
          $vcpkg = Join-Path $vcpkgRoot "vcpkg.exe"
          if (-not (Test-Path -LiteralPath $vcpkg)) {
            throw "vcpkg.exe was not found under $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # vcpkg hashes ABI-sensitive host tools (PowerShell and CMake) and the
          # vcpkg checkout itself into every package ABI, so a runner image update
          # silently invalidates the whole binary cache. Fingerprint those inputs
          # and feed the result into the cache key: a tool change then produces a
          # new key that is actually stored, instead of hitting a stale entry that
          # actions/cache refuses to overwrite.
          # A native command never raises on failure, so a probe that exits
          # non-zero or prints nothing would enter the fingerprint as a blank
          # line and let a later probe hide it.  Check both right away.
          function Invoke-Probe([string] $name, [string] $command, [string[]] $arguments) {
            $output = @(& $command @arguments)
            $code = $LASTEXITCODE
            if ($code -ne 0) { throw "$name probe failed with exit code $code" }
            $first = $output | Where-Object { $_ } | Select-Object -First 1
            if (-not $first) { throw "$name probe produced no output" }
            $first.Trim()
          }

          $tools = @(
            (Invoke-Probe "vcpkg" $vcpkg @("version"))
            $PSVersionTable.PSVersion.ToString()
            (Invoke-Probe "cmake" "cmake" @("--version"))
          )
          # The vcpkg bundled with Visual Studio and the installed MSVC toolsets
          # feed vcpkg's ports.cmake and triplet_abi hashes, so they belong in the
          # fingerprint; BUILD.py prefers that bundled vcpkg once vcvarsall has
          # exported VCPKG_ROOT.
          function Get-VisualStudioToolchain([string] $installPath) {
            $bundled = Join-Path $installPath "VC\vcpkg\vcpkg.exe"
            if (Test-Path -LiteralPath $bundled) {
              Invoke-Probe "vcpkg bundled with Visual Studio" $bundled @("version")
            }
            $msvcRoots = Join-Path $installPath "VC\Tools\MSVC"
            if (Test-Path -LiteralPath $msvcRoots) {
              Get-ChildItem -LiteralPath $msvcRoots -Directory |
                Sort-Object Name | ForEach-Object { $_.Name }
            }
          }

          # Query vswhere exactly as BUILD.py's find_vcvarsall does, then follow
          # the VCVARSALL / VCVARSALL_BAT overrides that it prefers.
          $vswherePath = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vswhereArgs = @(
            "-latest", "-products", "*",
            "-requires", "Microsoft.VisualStudio.Component.VC.Tools.x86.x64",
            "-version", "[17.0,)", "-property", "installationPath"
          )
          if (Test-Path -LiteralPath $vswherePath) {
            foreach ($installPath in (& $vswherePath @vswhereArgs)) {
              $tools += @(Get-VisualStudioToolchain $installPath)
            }
          }
          $vcvarsallOverrides = @($env:VCVARSALL, $env:VCVARSALL_BAT) | Where-Object { $_ }
          foreach ($vcvarsall in $vcvarsallOverrides) {
            $tools += "vcvarsall=$vcvarsall"
            if (Test-Path -LiteralPath $vcvarsall) {
              $tools += "vcvarsall.sha256=$((Get-FileHash -LiteralPath $vcvarsall -Algorithm SHA256).Hash)"
              # <VS>\VC\Auxiliary\Build\vcvarsall.bat -> <VS>
              $vsRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $vcvarsall)))
              $tools += @(Get-VisualStudioToolchain $vsRoot)
            }
          }
          if ($env:VCPKG_ROOT -and $env:VCPKG_ROOT -ne $vcpkgRoot) {
            $rootExe = Join-Path $env:VCPKG_ROOT "vcpkg.exe"
            if (Test-Path -LiteralPath $rootExe) {
              $tools += (Invoke-Probe "VCPKG_ROOT vcpkg" $rootExe @("version"))
            }
          }
          $fingerprint = $tools -join "`n"
          Write-Output "ABI tool fingerprint inputs:"
          Write-Output $fingerprint
          $sha = [System.Security.Cryptography.SHA256]::Create()
          $hash = ($sha.ComputeHash([System.Text.Encoding]::UTF8.GetBytes($fingerprint)) |
            ForEach-Object { $_.ToString("x2") }) -join ""
          if (-not $hash) { throw "Failed to compute the ABI tool fingerprint" }
          "fingerprint=$hash" >> $env:GITHUB_OUTPUT

      - name: Restore vcpkg downloads
        uses: actions/cache@v4
        with:
          path: .build_tmp/vcpkg-downloads
          key: windows-msvc-vcpkg-downloads-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}
          restore-keys: |
            windows-msvc-vcpkg-downloads-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: |
            .build_tmp/vcpkg-binary-cache
            .build_tmp/msvc/Release/vcpkg_installed
          key: windows-msvc-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-${{ steps.vcpkg-tools.outputs.fingerprint }}
          restore-keys: |
            windows-msvc-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'ports/**') }}-

      - name: Restore Rust build cache
        uses: actions/cache@v4
        with:
          # BUILD.py redirects CARGO_TARGET_DIR into .build_tmp, so the release
          # build does not live in rust/target; cargo test uses the default one.
          # The registry is cached too: cargo skips a dependency only while its
          # extracted sources are older than the restored fingerprints.
          path: |
            .build_tmp/msvc/Release/cargo-target
            rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-msvc-rust-${{ hashFiles('rust/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            windows-msvc-rust-

      - name: Prepare cache directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path .build_tmp\vcpkg-binary-cache | Out-Null

      - name: Validate build script
        run: python -m unittest tests.test_build_version

      - name: Build and package Slint application
        shell: pwsh
        run: python BUILD.py --msvc

      - name: Test Rust workspace
        shell: pwsh
        run: cargo test --manifest-path rust/Cargo.toml --locked --workspace

      - name: Verify packaged runtime
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "build\AviQtl.exe")) {
            throw "Packaged AviQtl.exe is missing"
          }
          if ((Get-ChildItem -LiteralPath build -Filter "Qt6*.dll" -File).Count -ne 0) {
            throw "Qt runtime DLLs must not be present in the Slint package"
          }
          if ((Get-ChildItem -LiteralPath build -Filter "avcodec*.dll" -File).Count -eq 0) {
            throw "FFmpeg runtime DLLs are missing"
          }
          foreach ($directory in @("effects", "objects", "plugins", "effect-packages", "repos")) {
            if (-not (Test-Path -LiteralPath (Join-Path "build" $directory))) {
              throw "Packaged resource directory is missing: $directory"
            }
          }
          if (-not (Test-Path -LiteralPath "dist\AviQtl-MSVC-x86_64.zip")) {
            throw "MSVC package archive was not created"
          }
